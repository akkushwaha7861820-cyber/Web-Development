<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS SHadows and Outline</title>
    <style>
        .box{
            border: 2px solid black;
            padding: 34px;
            box-shadow: 5px
            15px 5px #0eac7a; 

        }
        .text-element {
            text-shadow: 2px 2px 4px;
        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Ad esse odit repellendus accusamus, ipsam commodi id neque natus, alias facilis necessitatibus. Autem in molestias necessitatibus culpa nostrum cumque itaque distinctio.
    </p>
    
</body>
</html>
