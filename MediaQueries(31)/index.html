<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS media quiery</title>
    <style>
        body{
            background-color: yellow;
            
        }

        @media only screen and (max-width: 455px){
        body{
            background-color: rgb(3, 13, 104);

        }
        .boxes{
            flex-direction: column;
        }

    }

    .box{
        width: 34px;
        height: 34px;
        background-color: red;
        margin: 3px;
        padding: 3px;

    }

    .boxes{
        display: flex;
    }
    </style>
</head>
<body>
    <div>
        Hey I am a red guy!
    </div>
    <div class="box"></div>
      <div class="box"></div>
        <div class="box"></div>
    
</body>
</html>
