<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Ask4Medi - Login</title>
  <style>
    * {
      margin: 0; padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      display: flex; justify-content: center; align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
    }
    .container {
      width: 100%; max-width: 380px;
      background: #fff;
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0px 8px 20px rgba(0, 0, 0, 0.15);
      text-align: center;
      animation: fadeIn 1s ease-in-out;
    }
    h2 { margin-bottom: 1rem; font-size: 1.8rem; color: #333; }
    p { margin-bottom: 2rem; color: #777; }
    .form-group { margin-bottom: 1.2rem; text-align: left; }
    .form-group label {
      font-size: 0.9rem; color: #333;
      margin-bottom: 0.5rem; display: block;
    }
    .form-group input {
      width: 100%; padding: 0.8rem;
      border: 1px solid #ccc; border-radius: 10px;
      font-size: 1rem; transition: 0.3s;
    }
    .form-group input:focus {
      border-color: #4facfe; outline: none; box-shadow: 0 0 5px #4facfe;
    }
    .btn {
      width: 100%; padding: 0.9rem;
      border: none; border-radius: 10px;
      background: linear-gradient(135deg, #4facfe, #00f2fe);
      color: white; font-size: 1.1rem;
      cursor: pointer; transition: transform 0.2s ease-in-out;
    }
    .btn:hover { transform: scale(1.05); }
    .extra-links { margin-top: 1rem; font-size: 0.9rem; }
    .extra-links a {
      color: #4facfe; text-decoration: none;
      margin: 0 5px; cursor: pointer;
    }
    .extra-links a:hover { text-decoration: underline; }
    /* Modal Styles */
    .modal {
      display: none; position: fixed; z-index: 1000;
      left: 0; top: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.6);
      justify-content: center; align-items: center;
    }
    .modal-content {
      background: #fff; padding: 2rem;
      border-radius: 15px; width: 90%; max-width: 400px;
      text-align: center; animation: fadeIn 0.4s ease-in-out;
    }
    .close-btn {
      float: right; font-size: 1.5rem;
      color: #555; cursor: pointer;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>
  <!-- Login Container -->
  <div class="container" id="login-box">
    <h2>Ask4Medi</h2>
    <p>Login to your account</p>
    <form id="loginForm">
      <div class="form-group">
        <label for="loginContact">Email/Phone number</label>
        <input id="loginContact" type="text" placeholder="Enter your email or phone no" required />
      </div>
      <div class="form-group">
        <label for="loginPassword">Password</label>
        <input id="loginPassword" type="password" placeholder="Enter your password" required />
      </div>
      <button type="submit" class="btn">Login</button>
    </form>
    <div class="extra-links">
      <p><a id="forgotLink">Forgot Password?</a> | <a id="createLink">Create Account</a></p>
    </div>
  </div>

  <!-- Forgot Password Modal -->
  <div class="modal" id="forgotModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('forgotModal')">&times;</span>
      <h2>Forgot Password</h2>
      <p>Enter your email to reset your password</p>
      <form>
        <div class="form-group">
          <input type="text" placeholder="Enter your email/phone no" required />
        </div>
        <button type="submit" class="btn">Send OTP</button>
      </form>
    </div>
  </div>

  <!-- Create Account Modal -->
  <div class="modal" id="createModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeModal('createModal')">&times;</span>
      <h2>Create Account</h2>
      <form id="registerForm">
        <div class="form-group">
          <label for="fullname">Full Name</label>
          <input id="fullname" type="text" placeholder="Enter your Full Name" required />
        </div>
        <div class="form-group">
          <label for="regContact">Email Address or Phone Number</label>
          <input id="regContact" type="text" placeholder="Email or Phone no" required />
        </div>
        <div class="form-group">
          <label for="regPassword">Password</label>
          <input id="regPassword" type="password" placeholder="Password" required />
        </div>
        <button type="submit" class="btn">Register</button>
      </form>
    </div>
  </div>

  <script>
    // Open Modals
    document.getElementById("forgotLink").onclick = function() {
      document.getElementById("forgotModal").style.display = "flex";
    };
    document.getElementById("createLink").onclick = function() {
      document.getElementById("createModal").style.display = "flex";
    };

    // Close Modal
    function closeModal(id) {
      document.getElementById(id).style.display = "none";
    }

    // Close when clicking outside
    window.onclick = function(event) {
      let forgot = document.getElementById("forgotModal");
      let create = document.getElementById("createModal");
      if (event.target === forgot) forgot.style.display = "none";
      if (event.target === create) create.style.display = "none";
    };

    // Regex for email and phone
    const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
    const phoneRegex = /^[0-9]{10}$/;

    // LOGIN validation
    document.getElementById("loginForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let contact = document.getElementById("loginContact").value.trim();
      let password = document.getElementById("loginPassword").value.trim();

      if (!emailRegex.test(contact) && !phoneRegex.test(contact)) {
        alert("Please enter a valid Email OR 10-digit Phone number");
        return;
      }
      if (password.length < 6) {
        alert("Password must be at least 6 characters long");
        return;
      }
      alert("Login Successful!\nContact: " + contact);
    });

    // REGISTER validation
    document.getElementById("registerForm").addEventListener("submit", function(e) {
      e.preventDefault();
      let name = document.getElementById("fullname").value.trim();
      let contact = document.getElementById("regContact").value.trim();
      let password = document.getElementById("regPassword").value.trim();

      if (!emailRegex.test(contact) && !phoneRegex.test(contact)) {
        alert("Please enter a valid Email OR 10-digit Phone number");
        return;
      }
      if (password.length < 6) {
        alert("Password must be at least 6 characters long");
        return;
      }
      alert("Registered Successfully!\n\nName: " + name + "\nContact: " + contact);
      closeModal('createModal');
    });
  </script>
</body>
</html>
