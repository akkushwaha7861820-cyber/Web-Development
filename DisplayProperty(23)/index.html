<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Display Property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box {
            width: 334;
            border: 2px solid blue;
            display: inline-block;
            padding: 45px;
            margin-block-end: 34px;
                    
        }
        .box1{
            display: none;
            

        }
    </style>
</head>
<body>
    <div class="box">
        I am a box
    </div>
    <div class="box">
        Also a nice box
    </div>
    <span> I am good</span>
    <span>Boy</span>  
</body>
</html>
