<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Card</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300&display=swap');

    * {
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    .parent {
      margin: 10px;
      padding: 8px;
      box-shadow: 0px 0px 10px 0px grey;
      border-radius: 3%;
      height: 620px;
      width: 400px;
    }

    img {
      border-radius: 3%;
      height: 280px;
      width: 400px;
    }

    .s1 {
      font-size: 14px;
      display: inline-block;
      padding: 7px;
      margin: 10px;
      border-radius: 40px;
      border: 1px solid grey;
    }

    h1 {
      margin: 10px;
    }

    p {
      padding: 4px;
      font-size: 18px;
      font-weight: bold;
      color: rgb(114, 110, 110);
    }

    .s2 {
      position: relative;
      display: block;
      margin: auto;
      color: #4b88ce;
      font-weight: bolder;
      padding: 15px;
      background-color: #d8edff;
      border-radius: 40px;
      width: max-content;
    }
  </style>
</head>
<body>
  <div class="parent">
    <img src="https://images.pexels.com/photos/1903702/pexels-photo-1903702.jpeg?auto=compress&cs=tinysrgb&w=1600"
         alt="image">

    <span class="s1"> Nature </span>
    <span class="s1"> Lake </span>

    <h1>Mountains Mirage</h1>

    <p>“Climb the mountain not to plant your flag, but to embrace the challenge, enjoy the air and behold the view. Climb it so you can see the world, not so the world can see you.”</p>

    <span class="s2">  Read More  </span>
  </div>
</body>
</html>
