<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transform</title>
    <style>
        .box{
            background-color: beige;
            border:2px solid black;
            height: 50px;
            width: 50px;
         transform: rotate(0.25 turn);
         align-items: center;
         display: flex;
         justify-content: center;
         transform: translateY(100%) skew(40deg) translate(45%);


        }
        .container{
            width: 100vw;
            height: 80vh;
            border: 2px solid purple;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            box
        </div>
    </div>
    
</body>
</html>
