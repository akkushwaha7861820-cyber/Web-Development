<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS selector</title>
    <style>
        div{
            background-color: rgb(11, 123, 86);
        }
        .red{
            background-color: brown;
        }
        /* Id selector */
        #green{
            background-color: green;
        }
        /* child selector */
        div > p {
            color: blue;
            background-color: brown;
        }
        /* Descendant Selector */
        div p { 
            color: blue;
            background-color: brown;
        }
         /*Universal Selector */
         * {
            margin: 0;
            padding: 0;
         }

         /* Pseudo Selector */
         a:visited{
            color: yellow
         }

         a:link {
            color: green;
         }

         a:active{
            background-color: red;
         }

         a:hover{
            background-color: blueviolet;
         }
    </style>
</head>
<body>
    <div class="red">
        Hii i am a div
        <p>I am a para inside</p>
    </div>
    <div class="green">
        I am another div
    </div>
    <a href="https://www.google.com">Go to google</a>
    <br>
    <a href="https://www.facebook.com">Go to facebook</a>
</body>
</html>
