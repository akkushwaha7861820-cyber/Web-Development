<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Potion property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            height: 133px;
            width: 80vw;
            padding: 3px;
            margin: 3px;
            border: 2px solid black;
        }

        .box1{ 
            background-color: blue;
            position: sticky;
        }
         .box2{ 
            background-color: blueviolet;
            position: relative      
           }
          .box3{
            background-color: cadetblue;
          }
           .box4{ 
            background-color: aqua;
           }

           .parent{
            margin: 43px;
            padding: 34px;
            border: 5px solid rgb(239, 7, 7);
            position: relative;

           }
    </style>
</head>
<body>
    <div class="parent">

        <div class="box box1"></div>
        <div class="box box2"></div>
        <div class="box box3"></div>
        <div class="box box4"></div>
    </div>
</body>
</html>
